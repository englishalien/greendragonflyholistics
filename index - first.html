<!DOCTYPE HTML>
<html>
<head>
    <title>Green Dragonfly Holistics - Coming Soon</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    
    <!-- Google Font: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #849161; /* Sage Green */
            color: #eeeee6; /* Soft Cream */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .logo {
            max-width: 220px;
            height: auto;
            object-fit: contain;
            margin-bottom: 2rem;
        }

        h1 {
            font-weight: 400;
            font-size: 2.2rem;
            letter-spacing: -0.015em;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        p {
            font-weight: 300;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.6rem;
            }
            p {
                font-size: 1rem;
            }
            .logo {
                max-width: 170px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <img src="images/logo.png" alt="Green Dragonfly Holistics Logo" class="logo" onerror="this.style.display='none'">

        <!-- Main Heading & Text -->
        <h1>Green Dragonfly Holistics</h1>
        <p>coming soon...</p>
    </div>

</body>
</html>
